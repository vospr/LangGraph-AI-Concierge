[project]
name = "ai-concierge"
version = "0.1.0"
description = "LangGraph multi-agent AI Concierge — portfolio demo"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "langsmith>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.11"
# Strict typing covers the shipped code and the eval harness. tests/ is excluded:
# under strict it reports 77 errors, 47 of them unannotated test functions.
files = ["src", "main.py", "evals", "validate_config.py"]
strict = true
ignore_missing_imports = true
# types-PyYAML is not a dependency; PyYAML is only used to load config files.
disable_error_code = ["import-untyped"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests keep long assertion messages and string fixtures on one line; wrapping them
# hides the text being asserted. Source files stay under the 100-column limit.
"tests/**" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
