  - {text: "What's the weather in Zurich tomorrow?", route: fallback}
  - {text: "Who will win the election?", route: fallback}
  - {text: "What's the price of bitcoin?", route: fallback}
  - {text: "Tell me a joke", route: fallback}
  - {text: "hello", route: fallback}
  - {text: "asdf", route: fallback}
  - {text: "Write me a Python function to sort a list", route: fallback}
  - {text: "Can you help me?", route: fallback}
